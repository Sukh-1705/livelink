name: Keep Alive LiveLink

on:
  schedule:
    # Ping every 10 minutes to prevent Render free-tier sleep
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping LiveLink Health Endpoint
        run: |
          TARGET="${{ vars.LIVELINK_URL || secrets.LIVELINK_URL }}"
          if [ -z "$TARGET" ]; then
            echo "Note: Set LIVELINK_URL repository variable once your Render URL is assigned."
            exit 0
          fi
          echo "Pinging $TARGET/health ..."
          curl -s -f -m 20 "$TARGET/health" || echo "Keep-alive ping sent"
